<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, proxy-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Amber Road</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b0f14; color: #e8edf2; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    header { padding: 14px 16px; border-bottom: 1px solid #1e2a36; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
    header h1 { font-size: 16px; margin: 0; }
    header .meta { color: #8aa0b3; }
    #wrap { display: grid; grid-template-columns: 1fr; place-items: center; padding: 18px; }
    @media (pointer: coarse) {
      #wrap { padding: 10px; }
    }
    canvas { width: 100%; height: auto; border: 1px solid #1e2a36; border-radius: 14px; background: #0f1620; box-shadow: 0 12px 40px rgba(0,0,0,.35); image-rendering: pixelated; touch-action: none; }
    .hint { margin-top: 12px; color: #8aa0b3; text-align:center; max-width: min(960px, 96vw); }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; padding: 2px 6px; border: 1px solid #2a3a4b; border-bottom-color: #16202b; border-radius: 6px; background: #0f1620; color: #cfe6ff; }

    .devlog { margin-top: 12px; width: min(920px, calc(100vw - 28px)); border: 1px solid #1e2a36; border-radius: 14px; background: rgba(15,22,32,0.75); backdrop-filter: blur(8px); padding: 12px 14px; color: #cbd5e1; }
    .devlog-title { font-weight: 700; color: #e8edf2; margin-bottom: 6px; }
    .devlog-body { color: #a8bdcf; font-size: 13px; white-space: pre-line; max-height: 140px; overflow: auto; }

    #stage { position: relative; width: min(920px, calc(100vw - 28px)); }

    /* HTML UI overlay (modals above the canvas) */
    #ui-root { position:absolute; inset:0; pointer-events:none; display:none; }
    body.ui-open #ui-root { display:block; pointer-events:auto; }
    body.ui-open { overflow:hidden; }

    /* Disable iOS/Android long-press selection/callouts globally */
    html, body, #wrap, #stage, #ui-root, canvas, button, .devlog, .hint {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .cr-backdrop { position:absolute; inset:0; background: rgba(0,0,0,0.62); display:flex; align-items:center; justify-content:center; padding: clamp(10px, 2vw, 18px); }
    .cr-panel {
      width: min(860px, 96%);
      max-height: 96%;
      overflow:hidden;
      border-radius: 18px;
      border: 1px solid rgba(120, 92, 60, 0.65);
      background: rgba(235, 219, 185, 0.98);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
      color: #2a1f14;
    }
    @media (pointer: coarse) {
      .cr-panel { width: 100%; height: 100%; max-height: 100%; border-radius: 18px; }
    }

    .cr-head { display:flex; gap: 12px; align-items:flex-start; justify-content:space-between; padding: 14px 16px 10px; border-bottom: 1px solid rgba(120, 92, 60, 0.25); }
    .cr-title { font-weight: 900; font-size: 18px; line-height: 1.15; }
    .cr-sub { margin-top: 4px; color: rgba(74, 59, 42, 0.95); font-size: 13px; }
    .cr-close {
      border: 1px solid rgba(120, 92, 60, 0.35);
      background: rgba(0,0,0,0.04);
      color: #2a1f14;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }
    .cr-close:active { transform: translateY(1px); }

    .cr-tabs { display:flex; gap: 10px; padding: 10px 16px; }
    .cr-tab {
      flex: 1;
      border: 1px solid rgba(120, 92, 60, 0.35);
      background: rgba(0,0,0,0.04);
      border-radius: 14px;
      padding: 12px 12px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    .cr-tab[aria-selected="true"] { background: rgba(120, 92, 60, 0.16); border-color: rgba(120, 92, 60, 0.70); }
    .cr-action {
      border: 1px solid rgba(120, 92, 60, 0.35);
      background: rgba(0,0,0,0.04);
      border-radius: 14px;
      padding: 12px 12px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .cr-body { padding: 0 16px 14px; }
    .cr-list { overflow-x: hidden; overflow-y: auto; max-height: 56vh; padding: 6px 0 0; }

    /* Mobile: full-viewport backdrop + compact chrome + flexible body so list fills remaining height */
    @media (pointer: coarse) {
      /* Lift backdrop to viewport level so dialog isn't confined to the small canvas stage */
      .cr-backdrop { position: fixed; inset: 0; padding: 0; z-index: 9000; }
      .cr-panel { width: 100%; height: 100%; max-height: 100%; border-radius: 0; display: flex; flex-direction: column; }
      .cr-head { padding: 10px 12px 8px; }
      .cr-title { font-size: 16px; }
      .cr-sub { font-size: 12px; margin-top: 2px; }
      .cr-close { padding: 10px 12px; border-radius: 10px; min-height: 44px; }
      .cr-tabs { padding: 4px 10px 6px; gap: 6px; }
      .cr-tab { padding: 8px 10px; font-size: 13px; }
      .cr-action { padding: 10px 10px; font-size: 13px; }
      .cr-body { flex: 1; min-height: 0; padding: 0; display: flex; flex-direction: column; overflow: hidden; }
      .cr-list { flex: 1; min-height: 0; max-height: none; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 10px 8px; }
      .cr-foot { padding: 6px 12px; flex-shrink: 0; font-size: 12px; }
      .cr-rumors { margin-top: 4px; margin-bottom: 4px; padding: 6px 8px; }
      .cr-rumor { font-size: 11px; margin-top: 2px; }
    }

    .cr-card {
      width: 100%;
      box-sizing: border-box;
      text-align: left;
      border: 1px solid rgba(120, 92, 60, 0.28);
      background: rgba(0,0,0,0.03);
      border-radius: 14px;
      padding: 9px 10px;
      margin: 0 0 7px;
      display:flex;
      gap: 8px;
      align-items:center;
      justify-content:space-between;
    }
    .cr-card[aria-current="true"] { border-color: rgba(120, 92, 60, 0.72); background: rgba(120, 92, 60, 0.12); }
    .cr-card-left { flex: 1; min-width: 0; }
    .cr-card-title { font-weight: 900; font-size: 13px; line-height: 1.2; }
    .cr-card-sub { margin-top: 2px; font-size: 11px; color: rgba(74, 59, 42, 0.80); }

    /* Price row: buy/sell side by side */
    .cr-price-row { display: flex; gap: 6px; align-items: baseline; margin-top: 3px; }
    .cr-buy-price { font-weight: 900; font-size: 13px; color: #2a1f14; }
    .cr-sell-price { font-size: 11px; color: rgba(74, 59, 42, 0.65); }

    /* Right col: delta + button stacked compactly */
    .cr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }

    /* Delta badge */
    .cr-delta-up   { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: 0.03em; padding: 2px 5px; border-radius: 999px; background: rgba(220,60,40,0.12); color: #991b1b; border: 1px solid rgba(220,60,40,0.25); white-space: nowrap; }
    .cr-delta-down { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: 0.03em; padding: 2px 5px; border-radius: 999px; background: rgba(22,163,74,0.12); color: #166534; border: 1px solid rgba(22,163,74,0.25); white-space: nowrap; }
    .cr-delta-flat { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: 0.03em; padding: 2px 5px; border-radius: 999px; background: rgba(74,59,42,0.07); color: rgba(74,59,42,0.65); border: 1px solid rgba(74,59,42,0.15); white-space: nowrap; }
    .cr-right { text-align:right; min-width: 86px; }
    .cr-price { font-weight: 900; }
    .cr-badge { display:inline-block; margin-top: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 900; font-size: 11px; letter-spacing: 0.04em; border: 1px solid rgba(249,115,22,0.55); background: rgba(249,115,22,0.14); color: #9a3412; }

    .cr-foot { display:flex; gap: 12px; justify-content:space-between; align-items:center; padding: 12px 16px; border-top: 1px solid rgba(120, 92, 60, 0.22); background: rgba(10,14,20,0.06); }
    .cr-foot strong { font-weight: 900; }
    .cr-hint { color: rgba(74, 59, 42, 0.90); font-size: 12px; }

    .cr-rumors{ margin-top: 8px; padding: 8px 10px; border-radius: 14px; border: 1px dashed rgba(120, 92, 60, 0.35); background: rgba(10,14,20,0.04); box-sizing: border-box; }
    .cr-rumors-title{ font-weight: 900; font-size: 12px; letter-spacing: 0.04em; opacity: 0.85; }
    .cr-rumor{ margin-top: 4px; font-size: 12px; color: rgba(40, 30, 20, 0.90); }

    @media (max-width: 520px){
      .cr-rumors{ padding: 6px 8px; border-radius: 12px; }
      .cr-rumor{ font-size: 11px; }
    }

    @media (pointer: coarse) {
      .cr-card { flex-direction: row; align-items: center; }
      .cr-right { text-align: right; min-width: 72px; width: auto; }
      .cr-action { width: 72px; min-height: 38px; padding: 6px 8px; font-size: 12px; border-radius: 10px; }
      .cr-right .cr-tab { width: auto; }
    }

    /* Completion banner (stacking, max 3) */
    .cr-banner-stack{
      position: fixed;
      left: 10px;
      right: 10px;
      top: 10px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .cr-banner{
      background: linear-gradient(180deg, rgba(18,20,26,0.96), rgba(10,12,16,0.94));
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      border-radius: 14px;
      padding: 10px 12px;
      transform: translateY(-6px);
      opacity: 0;
      animation: crBannerIn 160ms ease-out forwards;
    }
    .cr-banner.out{
      animation: crBannerOut 260ms ease-in forwards;
    }
    .cr-banner-title{
      font-weight: 900;
      letter-spacing: 0.2px;
      font-size: 13px;
      color: #f8fafc;
    }
    .cr-banner-text{
      margin-top: 2px;
      opacity: 0.92;
      font-size: 12px;
      line-height: 1.25;
      color: #e2e8f0;
    }
    @keyframes crBannerIn{
      from{ transform: translateY(-10px); opacity: 0; }
      to{ transform: translateY(0); opacity: 1; }
    }
    @keyframes crBannerOut{
      from{ transform: translateY(0); opacity: 1; }
      to{ transform: translateY(-10px); opacity: 0; }
    }

    /* Touch controls under the stage */
    #touch-ui { width: min(920px, calc(100vw - 28px)); display:none; align-items:stretch; justify-content:space-between; gap: 12px; margin-top: 10px; pointer-events:none; }
    #touch-ui .pad, #touch-ui .actions { pointer-events:auto; }
    /* Responsive button sizing for mobile */
    #touch-ui { --btn: clamp(48px, 12vw, 64px); }

    #touch-ui .btn {
      width: var(--btn);
      height: var(--btn);
      border-radius: 14px;
      border: 1px solid #2a3a4b;
      background: rgba(15,22,32,0.78);
      color: #e8edf2;
      font: 800 16px system-ui;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    #touch-ui .btn:active { transform: translateY(1px); border-color:#38bdf8; }

    /* D-pad as a 3x2 grid: top row = Up, bottom row = Left/Down/Right */
    #touch-ui .pad {
      display:grid;
      grid-template-columns: var(--btn) var(--btn) var(--btn);
      grid-template-rows: var(--btn) var(--btn);
      gap: 8px;
      align-content:start;
    }
    #touch-ui .pad .btn { width: var(--btn); height: var(--btn); }

    /* Actions as a 2x2 grid, same size */
    #touch-ui .actions {
      display:grid;
      grid-template-columns: var(--btn) var(--btn);
      grid-template-rows: var(--btn) var(--btn);
      gap: 8px;
      justify-content:end;
      align-content:start;
    }

    @media (pointer: coarse) {
      #touch-ui { display:flex; }
    }
  </style>
</head>
<body>
  <header>
    <h1>The Amber Road</h1>
    <div class="meta">Top-down fantasy trading — roam, trade, survive the road</div>
  </header>
  <div id="wrap">
    <div id="stage" aria-label="Game stage">
      <canvas id="game" width="960" height="540" aria-label="The The Amber Road game canvas"></canvas>
      <div id="ui-root" aria-hidden="true"></div>
    </div>

    <!-- Touch controls (shown on coarse pointers). Placed UNDER the stage so it never blocks HUD/notes. -->
    <div id="touch-ui" aria-label="Touch controls">
      <div class="pad" aria-label="D-pad">
        <div></div>
        <button data-vkey="ArrowUp" class="btn">▲</button>
        <div></div>

        <button data-vkey="ArrowLeft" class="btn">◀</button>
        <button data-vkey="ArrowDown" class="btn">▼</button>
        <button data-vkey="ArrowRight" class="btn">▶</button>
      </div>
      <div class="actions" aria-label="Actions">
        <button data-vkey="KeyE" class="btn">E</button>
        <button data-vkey="Tab" class="btn">Tab</button>
        <button data-vkey="Enter" class="btn">Enter</button>
        <button data-vkey="Escape" class="btn">Esc</button>
      </div>
    </div>

    <div class="hint">
      Desktop: WASD/Arrows · E market · Tab buy/sell · Enter trade · Esc close<br/>
      Mobile: use on-screen buttons
    </div>

    <div id="devlog" class="devlog" aria-label="Iteration notes">
      <div class="devlog-title">Iteration Notes</div>
      <div class="devlog-body" id="devlog-body">Loading…</div>
      <div class="devlog-body" id="html-build" style="opacity:0.75; font-size:12px; margin-top:8px;">HTML build: v0.1.02</div>
    </div>
  </div>

  <div id="fatal" style="display:none; margin:16px auto; max-width:900px; padding:12px 14px; border:1px solid rgba(255,255,255,0.15); border-radius:12px; background:rgba(80,10,10,0.35); color:#fecaca; font:14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space:pre-wrap;"></div>

  <script>
    // Early crash guard: catches parse/load/runtime errors even if main.js never starts.
    (function(){

      // INLINE_JS_PROBE
      try {
        var dl = document.getElementById('devlog-body');
        if (dl && dl.textContent && dl.textContent.trim() === 'Loading…') {
          dl.textContent = 'Loading… (inline JS ok; starting main.js)';
        }
      } catch(e) {}

      // iOS in-app browsers sometimes block or delay scripts. If we detect a common in-app webview,
      // show a hint early so users know how to recover from a blank screen.
      try {
        var ua = (navigator && navigator.userAgent) ? navigator.userAgent : '';
        var isIOS = /iP(hone|od|ad)/.test(ua);
        var isInApp = /(FBAN|FBAV|Instagram|Line|WeChat|MicroMessenger)/i.test(ua);
        var inAppIOS = isIOS && isInApp;
        window.__INAPP_IOS = inAppIOS;
        if (inAppIOS) {
          var host = document.getElementById('devlog');
          if (host && !document.getElementById('inapp-hint')) {
            var hint = document.createElement('div');
            hint.id = 'inapp-hint';
            hint.className = 'devlog-body';
            hint.style.opacity = '0.9';
            hint.style.marginTop = '8px';
            hint.textContent = 'Tip (iOS in-app browser): if you see a blank/Loading screen, open this page in Safari (Share → Open in Browser).';
            host.appendChild(hint);
          }
        }
      } catch(e) {}

      const fatalEl = document.getElementById('fatal');
      function showFatal(msg){
        try {
          fatalEl.style.display = 'block';
          var extra = '';
          if (window.__INAPP_IOS) {
            extra = '\n\nPossible cause: iOS in-app browser blocked scripts. Try: Share → Open in Browser (Safari).';
          }
          fatalEl.textContent = 'The Amber Road failed to start. Please screenshot this:\n\n' + String(msg || 'Unknown error') + extra;
        } catch(e) {}
      }
      window.addEventListener('error', function(e){
        const err = (e && (e.error || e.message)) || e;
        showFatal(err && (err.stack || err.message) || err);
      });
      window.addEventListener('unhandledrejection', function(e){
        const err = (e && e.reason) || e;
        showFatal(err && (err.stack || err.message) || err);
      });

      var s = document.createElement('script');
      // Allow QA harness to run against the working tree without requiring a version bump.
      // Normal deploy uses explicit cache-bust (?v=X). QA uses ?qa=1.
      var qp = new URLSearchParams(location.search);
      var v = qp.get('v');
      var qa = qp.get('qa');
      s.src = './src/main.js' + (v ? ('?v=' + encodeURIComponent(v)) : (qa ? ('?qa=1&t=' + Date.now()) : ('?v=0.2.4&t=' + Date.now())));
      s.async = false;
      s.onerror = function(){ showFatal('Failed to load ./src/main.js (network/cache issue)'); };
      document.body.appendChild(s);

      // BOOT_WATCHDOG: if game doesn't signal boot within 1.5s, show a helpful message.
      setTimeout(function(){
        if (!window.__BOOT_OK) {
          showFatal('Boot watchdog: main.js loaded but did not start the game loop.\nTry: hard refresh / clear site data. If persists, screenshot this page.');
        }
      }, 1500);

    })();
  </script>
</body>
</html>
