name: World Simulation

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # allow manual trigger from GitHub Actions UI
    inputs:
      reset_traders:
        description: 'Re-seed all AI traders to a fresh state (run once after an economy rebalance)'
        type: boolean
        default: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run world simulation tick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Only a manual dispatch with the box ticked resets traders; scheduled ticks never do.
          RESET_TRADERS: ${{ (github.event_name == 'workflow_dispatch' && inputs.reset_traders) && '1' || '' }}
        run: node ops/scripts/world_service.mjs
