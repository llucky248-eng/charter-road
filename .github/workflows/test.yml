name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lint (syntax check)
        run: |
          node --check src/main.js
          find ops/scripts -name "*.mjs" -print0 | xargs -0 -n1 node --check

      - name: Run unit and parity tests
        run: npm run test:unit

  enforce-test-first:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if src/main.js changed without a test file
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -q "^src/main\.js$"; then
            if ! echo "$CHANGED" | grep -qE "^ops/scripts/(unit_tests|economy_parity_test|qa_selftest)\.mjs$"; then
              echo "ERROR: src/main.js changed without a corresponding test file update."
              echo ""
              echo "Test-first rule (CLAUDE.md): add or update a test in the same PR."
              echo "Touch one of:"
              echo "  ops/scripts/unit_tests.mjs"
              echo "  ops/scripts/economy_parity_test.mjs"
              echo "  ops/scripts/qa_selftest.mjs"
              exit 1
            fi
          fi

  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # Restore-only: the previous failed run's post-step poisoned the old key
      # with a partial download, so the combined cache action can't be trusted
      # (it saves even on job failure). The -v2- salt sidesteps that stale entry.
      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ steps.pw.outputs.version }}

      # Always run: idempotent and ~1s on a valid cache, and self-heals a partial
      # restore (Playwright re-downloads when its completion marker is missing).
      # Per-attempt timeout + retry ride out a stalled CDN edge; the loop's worst
      # case (~10m) stays under the 12m step backstop.
      - name: Install Playwright browser
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            echo "Playwright chromium install attempt $i/3"
            if timeout -k 10 200 ./node_modules/.bin/playwright install chromium; then
              exit 0
            fi
            echo "attempt $i stalled or failed; backing off before retry"
            sleep 5
          done
          echo "ERROR: playwright chromium install failed after 3 attempts" >&2
          exit 1

      # Save only on a clean miss: reaching this step means install succeeded
      # (a failed install aborts the job first), so the cached browser is whole.
      - name: Save Playwright browser cache
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ steps.pw.outputs.version }}

      # System libs aren't cacheable and apt can stall on a hosted runner; bound
      # it and don't fail the job — the self-test fails fast if a lib is missing.
      - name: Install Playwright system deps
        timeout-minutes: 8
        continue-on-error: true
        run: ./node_modules/.bin/playwright install-deps chromium

      - name: Run QA self-test (Playwright)
        run: npm run qa:selftest
