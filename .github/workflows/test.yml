name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lint (syntax check)
        run: |
          node --check src/main.js
          find ops/scripts -name "*.mjs" -print0 | xargs -0 -n1 node --check

      - name: Run unit and parity tests
        run: npm run test:unit

  enforce-test-first:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if src/main.js changed without a test file
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -q "^src/main\.js$"; then
            if ! echo "$CHANGED" | grep -qE "^ops/scripts/(unit_tests|economy_parity_test|qa_selftest)\.mjs$"; then
              echo "ERROR: src/main.js changed without a corresponding test file update."
              echo ""
              echo "Test-first rule (CLAUDE.md): add or update a test in the same PR."
              echo "Touch one of:"
              echo "  ops/scripts/unit_tests.mjs"
              echo "  ops/scripts/economy_parity_test.mjs"
              echo "  ops/scripts/qa_selftest.mjs"
              exit 1
            fi
          fi

  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: npx playwright install chromium

      # System libs aren't cacheable and apt can stall on a hosted runner; bound
      # it and don't fail the job — the self-test fails fast if a lib is missing.
      - name: Install Playwright system deps
        timeout-minutes: 8
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Run QA self-test (Playwright)
        run: npm run qa:selftest
