name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lint (syntax check)
        run: |
          node --check src/main.js
          find ops/scripts -name "*.mjs" -print0 | xargs -0 -n1 node --check

      - name: Run unit and parity tests
        run: npm run test:unit

  enforce-test-first:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if src/main.js changed without a test file
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -q "^src/main\.js$"; then
            if ! echo "$CHANGED" | grep -qE "^ops/scripts/(unit_tests|economy_parity_test|qa_selftest)\.mjs$"; then
              echo "ERROR: src/main.js changed without a corresponding test file update."
              echo ""
              echo "Test-first rule (CLAUDE.md): add or update a test in the same PR."
              echo "Touch one of:"
              echo "  ops/scripts/unit_tests.mjs"
              echo "  ops/scripts/economy_parity_test.mjs"
              echo "  ops/scripts/qa_selftest.mjs"
              exit 1
            fi
          fi

  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # The chromium binary can't be fetched on the hosted runner — cdn.playwright.dev
    # egress is blocked (403 'Host not in allowlist' locally; a full connect hang on
    # the runner). No timeout/retry/cache tuning can reach a blocked host, so run
    # inside the official Playwright image instead: it ships chromium + all system
    # libs pre-installed at $PLAYWRIGHT_BROWSERS_PATH (/ms-playwright), so there is
    # no browser download at all. The image tag MUST match the `playwright` version
    # in package.json (guarded below) or the bundled browser revision won't match.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # Fail fast + legibly if the installed playwright doesn't match the image's
      # bundled chromium. Checking the real invariant — does the browser the
      # installed playwright-core expects actually exist in this image? — beats
      # string-matching a version (no third copy to keep in sync, and it catches
      # any drift). A miss means package.json's playwright outgrew the container
      # tag below; bump the image to mcr.microsoft.com/playwright:v<version>-noble.
      - name: Verify image bundles the expected Chromium
        run: |
          node -e '
            const { chromium } = require("playwright");
            const { existsSync } = require("fs");
            const p = chromium.executablePath();
            if (!existsSync(p)) {
              const v = require("playwright/package.json").version;
              console.error(`::error::Installed playwright ${v} expects a Chromium at ${p}, but it is not in this image. The qa container tag must match the installed playwright version — set it to mcr.microsoft.com/playwright:v${v}-noble in .github/workflows/test.yml.`);
              process.exit(1);
            }
            console.log(`Chromium present at ${p}`);
          '

      - name: Run QA self-test (Playwright)
        run: npm run qa:selftest
